server {
    listen 8080;
    server_name _;

    # ALB のヘルスチェックは / を見る。画面本体は /admin。
    location = / {
        default_type text/plain;
        return 200 'ok';
    }

    location = /admin {
        return 301 /admin/;
    }

    location /admin/ {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /admin/index.html;
    }
}
