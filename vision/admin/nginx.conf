server {
    listen 8080;
    server_name _;
    # 相対の 301 を http://ホスト:8080 に展開しない。ALB の外は 443 の https。
    absolute_redirect off;

    # ALB のヘルスチェックは / を見る。画面本体は /admin。
    location = / {
        default_type text/plain;
        return 200 'ok';
    }

    location = /admin {
        return 301 /admin/;
    }

    location /admin/ {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /admin/index.html;
    }
}
